<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Remove a drop · 4dots</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0c0c0b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ebe9e4" media="(prefers-color-scheme: light)">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/admin.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="grain"></div>
  </div>

  <div class="shell">
    <header class="top">
      <a class="brand" href="/" aria-label="4dots, home">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="6.5" cy="6.5" r="4.5"/><circle cx="17.5" cy="6.5" r="4.5"/>
          <circle cx="6.5" cy="17.5" r="4.5"/><circle class="hot" cx="17.5" cy="17.5" r="4.5"/>
        </svg>
        <span>4dots</span>
      </a>
    </header>

    <section class="hero">
      <h1>Remove a drop.<br><span>For takedowns and abuse reports.</span></h1>
    </section>

    <main class="doc glass">
      <form class="admin" id="takedown" autocomplete="on">
        <label>
          <span>Drop code</span>
          <input class="field" name="code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off" placeholder="1234" data-bwignore data-1p-ignore data-lpignore="true" data-form-type="other">
        </label>
        <label>
          <span>Admin key</span>
          <input class="field" name="key" type="password" required autocomplete="current-password" placeholder="The ADMIN_TOKEN secret">
        </label>
        <button class="btn btn-primary" type="submit">Delete drop</button>
        <p class="admin-result" id="result" role="status" aria-live="polite"></p>
      </form>
    </main>
  </div>
</body>
</html>
